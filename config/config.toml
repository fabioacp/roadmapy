# Developer Platform Engineering — capacity configuration
# Edit this file by hand. It is the single source of truth about the team.

[team]
name = "Developer Platform Engineering"
# Nominal hours per week for one FTE. Used only for reporting in hours.
hours_per_week = 40
# Fraction of time that does NOT go to epics: meetings, on-call, support, interrupts.
# 0.30 = 30% of the time vanishes. Be honest here — this is the number that
# wrecks roadmaps most often.
overhead_pct = 0.30
# FTE assumed when the tool SUGGESTS someone for an open epic.
# 1.0 = the suggestion assumes that person is fully dedicated to the epic.
default_assignment_fte = 1.0
# Month that Q1 of the fiscal year starts in. 7 = July (Q1 Jul-Sep, Q2 Oct-Dec,
# Q3 Jan-Mar, Q4 Apr-Jun). The FY is named after the year it ENDS in, so with a
# July start, August 2026 falls in Q1 FY27. Set to 1 for calendar quarters.
fiscal_year_start_month = 7

# Throughput multiplier by seniority.
# Reference: 1 "senior-day" = 1 day of effective work by a senior.
# A mid at 0.7 takes 1/0.7 = 1.43 days to deliver 1 senior-day.
[throughput]
principal = 1.3
senior = 1.0
mid = 0.7
junior = 0.45

# Seniority order (lowest -> highest). Used for "I need at least a senior".
[seniority]
order = ["junior", "mid", "senior", "principal"]

# Holidays (not working days for anyone).
[calendar]
holidays = [
  "2026-01-01",
  "2026-04-03",
  "2026-04-25",
  "2026-06-08",
  "2026-12-25",
  "2026-12-28",
]

# ---------------------------------------------------------------------------
# Team roster
# seniority: one of the [throughput] keys
# skills:    free-form list, lowercase. Must match the skill:* labels in Jira.
# fte:       1.0 = full time. 0.5 = part time / split with another team.
# pto:       time off and planned absences (inclusive on both ends)
# ---------------------------------------------------------------------------

[[people]]
name = "Alex"
seniority = "senior"
skills = ["terraform", "aws", "kubernetes", "go", "ci-cd"]
fte = 1.0
pto = [{ start = "2026-08-03", end = "2026-08-14" }]

[[people]]
name = "Daniell"
seniority = "senior"
skills = ["kubernetes", "observability", "python", "ci-cd"]
fte = 1.0
pto = []

[[people]]
name = "Oscar"
seniority = "mid"
skills = ["terraform", "aws", "python"]
fte = 1.0
pto = [{ start = "2026-09-21", end = "2026-10-02" }]

[[people]]
name = "Karthi"
seniority = "mid"
skills = ["go", "backstage", "ci-cd", "observability"]
fte = 0.6   # 40% allocated to another team
pto = []

[[people]]
name = "Brad"
seniority = "junior"
skills = ["python", "ci-cd"]
fte = 1.0
pto = []

# ---------------------------------------------------------------------------
# How to read the Jira export.
# Adjust the column names to match your CSV header EXACTLY.
# Run `./dpe validate` to check before doing anything else.
# ---------------------------------------------------------------------------
[jira]
# Where the epics come from: "csv" (manual export) or "api" (Jira Cloud REST).
# Can be overridden on the command line with --source.
source = "csv"
# raw_csv = the untouched export you drop from Jira. `./dpe clean` reads it and
# writes the tidy `csv` below. Point it at a file, or at a folder — if it's a
# folder, the most recent *.csv inside wins (so a folder of dated exports works).
raw_csv = "data/raw"
csv = "data/epics.csv"          # the cleaned file everything else reads
# "points" or "days". If points, converts using points_to_days.
estimate_unit = "points"
points_to_days = 1.5
# Epics with no estimate come in with this value (in senior-days) and get flagged.
default_estimate_days = 10
# Labels that become a skill requirement: "skill:terraform" -> terraform
skill_label_prefix = "skill:"
# Label that requires a minimum seniority: "min:senior" -> senior or principal only
min_seniority_label_prefix = "min:"
# Label that assigns an owner: "owner:alex" or "owner:alex:60" (60% FTE).
# Several owner labels on one epic = shared ownership, co-scheduled.
owner_label_prefix = "owner:"
# Statuses that mean "already delivered" — they drop out of the roadmap.
done_statuses = ["Done", "Closed", "Resolved", "Cancelled"]
# Jira priority order (first = most urgent).
priority_order = ["Highest", "High", "Medium", "Low", "Lowest"]

# ---------------------------------------------------------------------------
# PRIORITY — overrides what came from Jira.
#
# Use the same scale as [jira] priority_order. Anything not listed here keeps its
# Jira priority. Within the same level, ties break on deadline → epic key; if you
# need an exact order between two epics at the same level, give them deadlines.
#
# Run `./dpe roadmap` after touching this: the PRIOR. column marks with * what you
# forced here, and `validate` warns if the key does not exist in the backlog.
# ---------------------------------------------------------------------------
[priority]
"DPE-1141" = "Highest"   # the catalog became a commitment to leadership
"DPE-1051" = "Low"       # can wait, nobody is blocked

# ---------------------------------------------------------------------------
# WHO IS WORKING ON WHAT  —  lives entirely in Jira, as owner: labels.
#
# There is NO assignment table here anymore. On the epic in Jira, add:
#
#   owner:alex             Alex owns it, 100% dedicated
#   owner:daniell:60       Daniell, 60% of his day on it (40% free for other work)
#   owner:alex owner:oscar two owners, shared and co-scheduled (they finish together)
#
# The slug after owner: must match a person's `alias` in [[people]] (which
# defaults to a slug of their name, e.g. "Ana Souza" -> "ana-souza").
#
# An epic with any owner: label is FACT — the tool schedules exactly those people.
# An epic with none is open backlog, and the tool suggests an owner (`./dpe suggest`).
# `./dpe validate` flags owner labels that don't cover the epic's skills, and
# anyone owning more than 100% across all their epics.
#
# ---------------------------------------------------------------------------
# Jira Cloud API access (REST v3).
#
# TODAY: transport = "stub" — the client runs end to end (builds the URL, pages,
#        maps the response), but against the fixture in stub_file. Nothing hits
#        the network.
#
# TO GO LIVE, two steps:
#        1. transport = "http" here, and fill in base_url + email
#        2. export JIRA_API_TOKEN='your-token'
#           (token at https://id.atlassian.com/manage-profile/security/api-tokens)
#
# The token NEVER goes in this file — only the environment variable name.
# ---------------------------------------------------------------------------
[jira.api]
transport = "stub"
base_url = "https://yourcompany.atlassian.net"
email = "you@yourcompany.com"
token_env = "JIRA_API_TOKEN"
jql = "project = DPE AND issuetype = Epic AND statusCategory != Done ORDER BY priority DESC"
page_size = 100
timeout_seconds = 30
stub_file = "data/jira_api_stub.json"

[jira.api.fields]
# Story Points is a custom field and the ID varies per instance. Find yours:
#   curl -u you@yourcompany.com:$JIRA_API_TOKEN \
#     https://yourcompany.atlassian.net/rest/api/3/field | grep -i "story point"
estimate = "customfield_10016"

# ---------------------------------------------------------------------------
# Column mapping — used only when source = "csv".
# ---------------------------------------------------------------------------
[jira.columns]
key = "Issue key"
summary = "Summary"
status = "Status"
assignee = "Assignee"
priority = "Priority"
estimate = "Custom field (Story Points)"
labels = "Labels"
due = "Due date"
