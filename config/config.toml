# Developer Platform Engineering — capacity configuration
# Edit this file by hand. It is the single source of truth about the team.

[team]
name = "Developer Platform Engineering"
# Month that Q1 of the fiscal year starts in. 7 = July (Q1 Jul-Sep, Q2 Oct-Dec,
# Q3 Jan-Mar, Q4 Apr-Jun). The FY is named after the year it ENDS in, so with a
# July start, August 2026 falls in Q1 FY27. Set to 1 for calendar quarters.
fiscal_year_start_month = 7

# The seniority levels that exist. The tool is date-driven, so these values are
# NOT effort multipliers anymore — only the names (and the order below) matter,
# for the "min:senior" requirement and the skill-coverage view.
[throughput]
principal = 1.0
senior = 1.0
mid = 1.0
junior = 1.0

# Seniority order (lowest -> highest). Used for "I need at least a senior".
[seniority]
order = ["junior", "mid", "senior", "principal"]

# Holidays (not working days for anyone).
[calendar]
holidays = [
  "2026-01-01",
  "2026-04-03",
  "2026-04-25",
  "2026-06-08",
  "2026-12-25",
  "2026-12-28",
]

# ---------------------------------------------------------------------------
# Team roster
# seniority: one of the [throughput] keys
# skills:    free-form list, lowercase. Must match the skill:* labels in Jira.
# fte:       1.0 = full time. 0.5 = part time / split with another team.
# pto:       time off and planned absences (inclusive on both ends)
# ---------------------------------------------------------------------------

